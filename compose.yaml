name: turnin

# Four services, no more: PHP, the web server in front of it, the database and
# the cache. Anything else has to earn its place (see docs/DEVELOPMENT.md).
services:
    app:
        build:
            context: .
            target: development
            args:
                HOST_UID: ${HOST_UID:-1000}
                HOST_GID: ${HOST_GID:-1000}
        environment:
            APP_ENV: ${APP_ENV:-dev}
            APP_DEBUG: ${APP_DEBUG:-1}
            # PHP-FPM is only reachable through Caddy, so trusting the immediate
            # proxy is what lets Symfony recover the original scheme and host.
            SYMFONY_TRUSTED_PROXIES: REMOTE_ADDR
            SYMFONY_TRUSTED_HEADERS: x-forwarded-for,x-forwarded-proto,x-forwarded-port
            XDEBUG_MODE: ${XDEBUG_MODE:-off}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./:/var/www/app
            - composer_cache:/tmp/composer/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    web:
        image: caddy:2.10-alpine
        ports:
            - "127.0.0.1:${HTTP_PORT:-8080}:80"
        volumes:
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - ./public:/var/www/app/public:ro
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

    postgres:
        image: postgres:${POSTGRES_VERSION:-18}-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-turnin}
            POSTGRES_USER: ${POSTGRES_USER:-turnin}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turnin}
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
        volumes:
            # PostgreSQL 18 moved the cluster out of the old data/ subdirectory.
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-turnin} -d ${POSTGRES_DB:-turnin}"]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:8-alpine
        command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
        ports:
            - "127.0.0.1:${REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20

volumes:
    composer_cache:
    postgres_data:
    redis_data:

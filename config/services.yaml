# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# Entry point for Turnin's own services. Nearly everything is convention;
# explicit definitions are the exception and each one states why it exists.
#
# Dependency rule (enforced by deptrac.yaml and tests/Architecture):
#     Domain  ←  Application  ←  Infrastructure
# Domain knows nothing about Symfony or Doctrine. See docs/ARCHITECTURE.md.

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Probes are discovered by tag, so the handler does not have to know
            # which dependencies exist.
            iterable $probes: !tagged_iterator turnin.health_probe
            # The Redis probe opens its own short-lived connection instead of
            # reusing the cache pool — see the class docblock.
            string $dsn: '%env(REDIS_URL)%'
            iterable $workplaceCatalogSources: !tagged_iterator turnin.workplace_catalog_source
            string $piiHmacKey: '%env(PII_HMAC_KEY)%'
            string $piiEncryptionKey: '%env(PII_ENCRYPTION_KEY)%'
            string $calendarTokenEncryptionKey: '%env(CALENDAR_TOKEN_ENCRYPTION_KEY)%'
            string $googleOAuthClientId: '%env(GOOGLE_OAUTH_CLIENT_ID)%'
            string $googleOAuthClientSecret: '%env(GOOGLE_OAUTH_CLIENT_SECRET)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # The domain model is not a service graph. Value objects and
            # aggregates are constructed by the code that owns them; registering
            # them would invite constructor injection into the model itself.
            - '../src/*/*/Domain/'
            - '../src/*/Domain/'
            # Three explicitly configured instances below represent the three
            # official catalogs and share one small adapter implementation.
            - '../src/Workforce/Infrastructure/Ministry/MinistryWorkplaceCatalog.php'

    _instanceof:
        App\Platform\System\Domain\HealthProbe:
            tags: ['turnin.health_probe']

        Monolog\Processor\ProcessorInterface:
            tags: ['monolog.processor']

        App\Workforce\Domain\WorkplaceCatalogSource:
            tags: ['turnin.workplace_catalog_source']

    # The migrations bundle does not alias its dependency factory, and the
    # schema probe is the only thing that needs it.
    Doctrine\Migrations\DependencyFactory: '@doctrine.migrations.dependency_factory'

    # --- CQRS wiring --------------------------------------------------------
    # Handlers are plain Application classes with no framework attributes: the
    # bus they belong to is a wiring decision, so it is expressed here. Add a
    # Command block with the same shape when the first command handler lands.
    turnin.query_handlers:
        namespace: App\
        resource: '../src/*/*/Application/Query/*Handler.php'
        tags:
            - { name: 'messenger.message_handler', bus: 'query.bus' }

    turnin.workforce_query_handlers:
        namespace: App\Workforce\Application\Query\
        resource: '../src/Workforce/Application/Query/*Handler.php'
        tags:
            - { name: 'messenger.message_handler', bus: 'query.bus' }

    turnin.workforce_command_handlers:
        namespace: App\Workforce\Application\Command\
        resource: '../src/Workforce/Application/Command/*Handler.php'
        tags:
            - { name: 'messenger.message_handler', bus: 'command.bus' }

    turnin.scheduling_query_handlers:
        namespace: App\Scheduling\Application\Query\
        resource: '../src/Scheduling/Application/Query/*Handler.php'
        tags:
            - { name: 'messenger.message_handler', bus: 'query.bus' }

    turnin.scheduling_command_handlers:
        namespace: App\Scheduling\Application\Command\
        resource: '../src/Scheduling/Application/Command/*Handler.php'
        tags:
            - { name: 'messenger.message_handler', bus: 'command.bus' }

    turnin.swap_query_handlers:
        namespace: App\Swap\Application\Query\
        resource: '../src/Swap/Application/Query/*Handler.php'
        tags:
            - { name: 'messenger.message_handler', bus: 'query.bus' }

    turnin.swap_command_handlers:
        namespace: App\Swap\Application\Command\
        resource: '../src/Swap/Application/Command/*Handler.php'
        tags:
            - { name: 'messenger.message_handler', bus: 'command.bus' }

    turnin.identity_command_handlers:
        namespace: App\Platform\Identity\Application\Command\
        resource: '../src/Platform/Identity/Application/Command/*Handler.php'
        tags:
            - { name: 'messenger.message_handler', bus: 'command.bus' }

    App\Workforce\Domain\Workplaces: '@App\Workforce\Infrastructure\Persistence\Doctrine\DoctrineWorkplaces'
    App\Workforce\Domain\WorkplaceIdGenerator: '@App\Workforce\Infrastructure\Identity\SymfonyWorkplaceIdGenerator'
    App\Workforce\Domain\StaffCategories: '@App\Workforce\Infrastructure\Persistence\Doctrine\DoctrineStaffCategories'
    App\Workforce\Domain\OrganizationalUnits: '@App\Workforce\Infrastructure\Persistence\Doctrine\DoctrineOrganizationalUnits'
    App\Workforce\Domain\OrganizationalUnitIdGenerator: '@App\Workforce\Infrastructure\Identity\SymfonyOrganizationalUnitIdGenerator'
    App\Workforce\Domain\WorkplaceReader: '@App\Workforce\Infrastructure\Persistence\Doctrine\DoctrineWorkplaces'
    App\Workforce\Domain\WorkerAssignmentIdGenerator: '@App\Workforce\Infrastructure\Identity\SymfonyWorkerAssignmentIdGenerator'
    App\Workforce\Domain\WorkerAssignmentWriter: '@App\Workforce\Infrastructure\Persistence\Doctrine\DoctrineWorkerAssignmentWriter'
    App\Workforce\Domain\WorkerAssignments: '@App\Workforce\Infrastructure\Persistence\Doctrine\DoctrineWorkerAssignmentWriter'
    App\Workforce\Domain\WorkerOnboardingDrafts: '@App\Workforce\Infrastructure\Persistence\Doctrine\DoctrineWorkerOnboardingDrafts'
    App\Workforce\Domain\SwapPoolResolver: ~
    App\Platform\Identity\Domain\Users: '@App\Platform\Identity\Infrastructure\Persistence\Doctrine\DoctrineUsers'
    App\Platform\Identity\Domain\PasswordHasher: '@App\Platform\Identity\Infrastructure\Security\SymfonyPasswordHasher'
    App\Platform\Identity\Domain\UserIdGenerator: '@App\Platform\Identity\Infrastructure\Identity\SymfonyUserIdGenerator'
    App\Platform\Identity\Domain\PostAuthenticationDestinationResolver: ~
    App\Platform\Identity\Domain\ExternalIdentities: '@App\Platform\Identity\Infrastructure\Persistence\Doctrine\DoctrineExternalIdentities'
    App\Platform\Identity\Domain\ExternalIdentityIdGenerator: '@App\Platform\Identity\Infrastructure\Identity\SymfonyExternalIdentityIdGenerator'
    App\Platform\Identity\Domain\IdentityTransaction: '@App\Platform\Identity\Infrastructure\Persistence\Doctrine\DoctrineIdentityTransaction'
    App\Platform\Identity\Domain\PersonalProfiles: '@App\Platform\Identity\Infrastructure\Persistence\Doctrine\DoctrinePersonalProfiles'
    App\Platform\Identity\Domain\UsageIdentities: '@App\Platform\Identity\Infrastructure\Persistence\Doctrine\DoctrineUsageIdentities'
    App\Platform\Identity\Domain\UsageIdentityIdGenerator: '@App\Platform\Identity\Infrastructure\Identity\SymfonyUsageIdentityIdGenerator'
    App\Platform\Identity\Domain\PersonalIdentifierFingerprinter: '@App\Platform\Identity\Infrastructure\Security\HmacPersonalIdentifierFingerprinter'
    App\Platform\Identity\Domain\PersonalDataCipher: '@App\Platform\Identity\Infrastructure\Security\SodiumPersonalDataCipher'
    App\Workforce\Domain\WorkerProfileCompletion: '@App\Platform\Identity\Infrastructure\Workforce\IdentityWorkerProfileCompletion'
    App\Workforce\Domain\AuthenticatedWorker: '@App\Platform\Identity\Infrastructure\Workforce\DatabaseAuthenticatedWorker'
    App\Workforce\Domain\WorkerOnboardingIdentity: '@App\Platform\Identity\Infrastructure\Workforce\IdentityWorkerOnboardingIdentity'

    # --- Scheduling ---------------------------------------------------------
    # The roster repositories talk DBAL rather than the ORM: a roster day owns a
    # collection of segments, and an ORM association would put a Doctrine
    # Collection on a Domain class. See docs/adr/0008-roster-and-calendar-model.md.
    App\Scheduling\Domain\RosterDays: '@App\Scheduling\Infrastructure\Persistence\Doctrine\DoctrineRosterDays'
    App\Scheduling\Domain\ShiftPresets: '@App\Scheduling\Infrastructure\Persistence\Doctrine\DoctrineShiftPresets'
    App\Scheduling\Domain\RosterPatterns: '@App\Scheduling\Infrastructure\Persistence\Doctrine\DoctrineRosterPatterns'
    App\Scheduling\Domain\RosterIdGenerator: '@App\Scheduling\Infrastructure\Identity\SymfonyRosterIdGenerator'
    # Declared by Scheduling, implemented by Workforce, which owns the data.
    App\Scheduling\Domain\AssignedWorkers: '@App\Workforce\Infrastructure\Scheduling\WorkforceAssignedWorkers'
    App\Scheduling\Domain\AuthenticatedWorkers: '@App\Platform\Identity\Infrastructure\Scheduling\IdentityAuthenticatedWorkers'

    # --- Swap ---------------------------------------------------------------
    # Three ports declared by Swap and implemented by whoever owns the data:
    # the pools by Workforce, the calendar by Scheduling, the people by Identity.
    # Swap never reads another context's tables. See docs/CONTEXT_MAP.md.
    App\Swap\Domain\SwapRequests: '@App\Swap\Infrastructure\Persistence\Doctrine\DoctrineSwapRequests'
    App\Swap\Domain\Availabilities: '@App\Swap\Infrastructure\Persistence\Doctrine\DoctrineAvailabilities'
    App\Swap\Domain\SwapIdGenerator: '@App\Swap\Infrastructure\Identity\SymfonySwapIdGenerator'
    App\Swap\Domain\SwapGroups: '@App\Workforce\Infrastructure\Swap\WorkforceSwapGroups'
    App\Swap\Domain\RosteredDays: '@App\Scheduling\Infrastructure\Swap\SchedulingRosteredDays'
    App\Swap\Domain\AuthenticatedWorkers: '@App\Platform\Identity\Infrastructure\Swap\IdentitySwapWorkers'
    App\Swap\Domain\WorkerDisplayNames: '@App\Platform\Identity\Infrastructure\Swap\IdentitySwapWorkers'
    App\Scheduling\Domain\CalendarInsightSource: '@App\Scheduling\Domain\RestStreakInsights'
    App\Scheduling\Application\ExternalCalendar\CalendarTokenCipher: '@App\Scheduling\Infrastructure\ExternalCalendar\SodiumCalendarTokenCipher'
    App\Scheduling\Application\ExternalCalendar\ExternalCalendarConnections: '@App\Scheduling\Infrastructure\Persistence\Doctrine\DoctrineExternalCalendars'
    App\Scheduling\Application\ExternalCalendar\ExternalCalendarMappings: '@App\Scheduling\Infrastructure\Persistence\Doctrine\DoctrineExternalCalendars'
    App\Scheduling\Application\ExternalCalendar\ExternalRosterEvents: '@App\Scheduling\Infrastructure\Persistence\Doctrine\DoctrineExternalCalendars'
    App\Scheduling\Application\ExternalCalendar\ExternalCalendarProvider: '@App\Scheduling\Infrastructure\ExternalCalendar\GoogleCalendarProvider'
    App\Scheduling\Domain\RestStreakInsights: ~
    App\Scheduling\Domain\ScheduleDraftComposer: ~
    App\Scheduling\Domain\ScheduleDraftResolver: ~
    App\Scheduling\Domain\ScheduleTextParser: ~
    App\Scheduling\Domain\DateExpressionParser: ~
    App\Scheduling\Domain\RepeatingRosterPatternDetector: ~

    workforce.ministry.primary_care:
        class: App\Workforce\Infrastructure\Ministry\MinistryWorkplaceCatalog
        arguments:
            $catalogSource: !php/enum App\Workforce\Domain\WorkplaceSource::MINISTRY_PRIMARY_CARE
            $csvUrl: 'https://www.sanidad.gob.es/ciudadanos/centros.do?localidad=&zonaBasica=&municipio=&botonCentros=1&6578706f7274=1&areaSalud=&provincia=%%25&comunidad=%%25&accion=Consultar&d-4015022-e=1'
            $spreadsheetUrl: 'https://www.sanidad.gob.es/estadEstudios/estadisticas/docs/siap/2026_C_Catal_Centros_AP.xlsx'
            $worksheet: 'xl/worksheets/sheet3.xml'

    workforce.ministry.urgent_care:
        class: App\Workforce\Infrastructure\Ministry\MinistryWorkplaceCatalog
        arguments:
            $catalogSource: !php/enum App\Workforce\Domain\WorkplaceSource::MINISTRY_URGENT_CARE
            $csvUrl: 'https://www.sanidad.gob.es/ciudadanos/centros.do?localidad=&municipio=&dispositivo=&6578706f7274=1&tipoDispositivo=&d-4015023-e=1&provincia=%%25&comunidad=%%25&accion=Consultar&botonDispositivo=3'
            $spreadsheetUrl: 'https://www.sanidad.gob.es/estadEstudios/estadisticas/docs/siap/2026_C_Catal_disp_urg.xlsx'
            $worksheet: 'xl/worksheets/sheet2.xml'

    workforce.ministry.hospitals:
        class: App\Workforce\Infrastructure\Ministry\MinistryWorkplaceCatalog
        arguments:
            $catalogSource: !php/enum App\Workforce\Domain\WorkplaceSource::MINISTRY_HOSPITALS
            $csvUrl: 'https://www.sanidad.gob.es/ciudadanos/centros.do?dependenciaTipoCentro=&6578706f7274=1&nombreHosp=&botonHospitales=2&finalidadAsistencial=&d-4015021-e=1&provincia=&accion=Consultar&comunidad=&dependenciaFuncional='
            $spreadsheetUrl: 'https://www.sanidad.gob.es/estadEstudios/estadisticas/sisInfSanSNS/ofertaRecursos/hospitales/docs/CNH_2025.xlsx'
            $worksheet: 'xl/worksheets/sheet1.xml'

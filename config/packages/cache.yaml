framework:
    cache:
        # Stable namespace so two deployments of Turnin can share a Redis server
        # without colliding.
        prefix_seed: turnin

        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

when@test:
    framework:
        cache:
            # Tests must not depend on a warm cache, nor leak state between runs.
            app: cache.adapter.array

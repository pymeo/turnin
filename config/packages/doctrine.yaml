doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'

        # Turnin stores instants, never local wall-clock strings. TIMESTAMPTZ is
        # the only PostgreSQL type that round-trips an unambiguous instant, so we
        # make it the default for date-time columns. See docs/DOMAIN.md § Time.
        types:
            datetime_immutable: Doctrine\DBAL\Types\DateTimeTzImmutableType
            workplace_id: App\Workforce\Infrastructure\Persistence\Doctrine\WorkplaceIdType
            identity_user_id: App\Platform\Identity\Infrastructure\Persistence\Doctrine\UserIdType
            identity_email: App\Platform\Identity\Infrastructure\Persistence\Doctrine\EmailType

    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        # Aggregates are plain PHP objects: they must not carry Doctrine
        # attributes, so mapping is declared in XML from the Infrastructure layer.
        # `auto_mapping` would go hunting for annotated entities in src/ — exactly
        # what we do not want. Register one entry per context as aggregates land:
        #
        #     mappings:
        #         Scheduling:
        #             type: xml
        #             is_bundle: false
        #             dir: '%kernel.project_dir%/src/Scheduling/Infrastructure/Persistence/Doctrine/Mapping'
        #             prefix: 'App\Scheduling\Domain'
        #
        auto_mapping: false
        mappings:
            Workforce:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Workforce/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Workforce\Domain'
            Identity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Platform/Identity/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Platform\Identity\Domain'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

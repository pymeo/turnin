; Shared PHP settings for every stage. Production overrides live in
; docker/php/conf.d/opcache-prod.ini.

memory_limit = 512M
max_execution_time = 60

; Turnin is a scheduling product: an ambiguous default timezone would silently
; corrupt shift boundaries. UTC here is deliberate — the *display* timezone is a
; per-user concern resolved in the application layer, never a php.ini default.
date.timezone = UTC

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Uploads are not part of the bootstrap; keep the surface small until they are.
file_uploads = On
upload_max_filesize = 8M
post_max_size = 10M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
